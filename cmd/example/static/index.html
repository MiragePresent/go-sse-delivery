<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d9ff;
        }
        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
        }
        .panel h2 {
            margin-bottom: 15px;
            color: #00d9ff;
            font-size: 1.2rem;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
        }
        .status-dot.connected {
            background: #2ed573;
        }
        .messages {
            background: #0f0f23;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .message {
            padding: 8px;
            margin-bottom: 8px;
            background: #1a1a2e;
            border-radius: 4px;
            border-left: 3px solid #00d9ff;
        }
        .message .time {
            color: #666;
            font-size: 0.8rem;
        }
        .sender-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input, select {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #0f0f23;
            color: #eee;
            font-size: 1rem;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #00d9ff;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #00b8d9;
        }
        .preview {
            background: #0f0f23;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSE Delivery Demo</h1>
        <div class="panels">
            <div class="panel">
                <h2>Send Events</h2>
                <div class="sender-form">
                    <input type="text" id="senderId" placeholder="Sender ID" value="user-1">
                    <select id="eventType">
                        <option value="message">message</option>
                        <option value="notification">notification</option>
                        <option value="alert">alert</option>
                    </select>
                    <button onclick="generateAndSend()">Generate Random Message</button>
                    <div class="preview">
                        <strong>Last sent:</strong>
                        <div id="lastSent">Nothing sent yet</div>
                    </div>
                </div>
            </div>
            <div class="panel">
                <h2>Received Updates</h2>
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Disconnected</span>
                </div>
                <div class="messages" id="messages"></div>
            </div>
        </div>
    </div>

    <script>
        const clientID = "client-" + Math.ceil(Math.random() * 10000)
        const subjects = ['The cat', 'A developer', 'The server', 'My coffee', 'The database', 'A wild bug', 'The user', 'Our deployment'];
        const verbs = ['is running', 'just exploded', 'needs attention', 'started dancing', 'went offline', 'is on fire', 'requires coffee', 'completed successfully'];
        const adverbs = ['frantically', 'mysteriously', 'unexpectedly', 'gracefully', 'loudly', 'silently', 'happily', 'sadly'];

        function randomSentence() {
            const subject = subjects[Math.floor(Math.random() * subjects.length)];
            const verb = verbs[Math.floor(Math.random() * verbs.length)];
            const adverb = adverbs[Math.floor(Math.random() * adverbs.length)];
            return `${subject} ${verb} ${adverb}.`;
        }

        let abortController = null;

        async function connect() {
            if (abortController) {
                abortController.abort();
            }

            abortController = new AbortController();

            try {
                const response = await fetch('/live-updates', {
                    headers: { 'SSE-Client-ID': clientID },
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error('Connection failed');
                }

                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = `Connected (${clientID})`;

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = decoder.decode(value);
                    const lines = text.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            addMessage(line.slice(6));
                        }
                    }
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    document.getElementById('statusDot').classList.remove('connected');
                    document.getElementById('statusText').textContent = 'Disconnected - Reconnecting...';
                    setTimeout(connect, 2000);
                }
            }
        }

        function addMessage(data) {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            const time = new Date().toLocaleTimeString();
            messageDiv.innerHTML = `<span class="time">${time}</span><br>${data}`;
            messages.insertBefore(messageDiv, messages.firstChild);
        }

        async function generateAndSend() {
            const senderId = document.getElementById('senderId').value || 'anonymous';
            const eventType = document.getElementById('eventType').value;
            const data = randomSentence();

            const event = {
                senderId: senderId,
                eventType: eventType,
                data: data
            };

            try {
                const response = await fetch('/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'SSE-Client-ID': clientID },
                    body: JSON.stringify(event)
                });

                if (response.ok) {
                    document.getElementById('lastSent').textContent = JSON.stringify(event, null, 2);
                } else {
                    const error = await response.json();
                    document.getElementById('lastSent').textContent = `Error: ${error.error}`;
                }
            } catch (err) {
                document.getElementById('lastSent').textContent = `Error: ${err.message}`;
            }
        }

        connect();
    </script>
</body>
</html>
