<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d9ff;
        }
        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: #16213e;
            border-radius: 10px;
            padding: 20px;
        }
        .panel h2 {
            margin-bottom: 15px;
            color: #00d9ff;
            font-size: 1.2rem;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
        }
        .status-dot.connected {
            background: #2ed573;
        }
        .messages {
            background: #0f0f23;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .message {
            padding: 8px;
            margin-bottom: 8px;
            background: #1a1a2e;
            border-radius: 4px;
            border-left: 3px solid #00d9ff;
        }
        .message .time {
            color: #666;
            font-size: 0.8rem;
        }
        .sender-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        select {
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #0f0f23;
            color: #eee;
            font-size: 1rem;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #00d9ff;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #00b8d9;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .preview {
            background: #0f0f23;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #888;
        }
        .connection-id {
            font-family: monospace;
            font-size: 0.8rem;
            color: #00d9ff;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SSE Delivery Demo</h1>
        <div class="panels">
            <div class="panel">
                <h2>Send Signals</h2>
                <div class="sender-form">
                    <select id="type">
                        <option value="message">message</option>
                        <option value="notification">notification</option>
                        <option value="alert">alert</option>
                    </select>
                    <button id="sendBtn" onclick="sendSignal()" disabled>Send Random Signal</button>
                    <h2>Debug</h2>
                    <div class="preview">
                        <strong>Connection ID:</strong>
                        <div id="connectionInfo" class="connection-id">Waiting for connection...</div>
                    </div>
                    <div class="preview">
                        <strong>Last sent:</strong>
                        <div id="lastSent">Nothing sent yet</div>
                    </div>
                    <button onclick="window.open('/demo/', '_blank')">Open Another Client</button>
                </div>
            </div>
            <div class="panel">
                <h2>Received Updates</h2>
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
                <div class="messages" id="messages"></div>
            </div>
        </div>
    </div>

    <script>
        let connectionID = null;

        const subjects = ['The cat', 'A developer', 'The server', 'My coffee', 'The database', 'A wild bug', 'The user', 'Our deployment'];
        const verbs = ['is running', 'just exploded', 'needs attention', 'started dancing', 'went offline', 'is on fire', 'requires coffee', 'completed successfully'];
        const adverbs = ['frantically', 'mysteriously', 'unexpectedly', 'gracefully', 'loudly', 'silently', 'happily', 'sadly'];

        function randomSentence() {
            const subject = subjects[Math.floor(Math.random() * subjects.length)];
            const verb = verbs[Math.floor(Math.random() * verbs.length)];
            const adverb = adverbs[Math.floor(Math.random() * adverbs.length)];
            return `${subject} ${verb} ${adverb}.`;
        }

        function connect() {
            const eventSource = new EventSource('/live-updates');

            eventSource.addEventListener('connected', (e) => {
                connectionID = e.data;
                document.getElementById('connectionInfo').textContent = connectionID;
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Connected';
                document.getElementById('sendBtn').disabled = false;
                addMessage(`Connected with ID: ${connectionID}`);
            });

            eventSource.onmessage = (e) => {
                addMessage(e.data);
            };

            eventSource.onerror = () => {
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Disconnected - Reconnecting...';
                document.getElementById('sendBtn').disabled = true;
                connectionID = null;
                eventSource.close();
                setTimeout(connect, 2000);
            };
        }

        function addMessage(data) {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            const time = new Date().toLocaleTimeString();
            messageDiv.innerHTML = `<span class="time">${time}</span><br>${data}`;
            messages.insertBefore(messageDiv, messages.firstChild);
        }

        async function sendSignal() {
            if (!connectionID) {
                document.getElementById('lastSent').textContent = 'Error: Not connected';
                return;
            }

            const type = document.getElementById('type').value;
            const data = randomSentence();

            const signal = {
                type: type,
                data: data
            };

            try {
                const response = await fetch(`/signals?connectionId=${connectionID}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(signal)
                });

                if (response.status === 202) {
                    document.getElementById('lastSent').textContent = JSON.stringify(signal, null, 2);
                } else if (response.status === 200) {
                    const newConnectionID = await response.text();
                    document.getElementById('lastSent').textContent = `New connection: ${newConnectionID}\n` + JSON.stringify(signal, null, 2);
                } else {
                    const error = await response.text();
                    document.getElementById('lastSent').textContent = `Error: ${error}`;
                }
            } catch (err) {
                document.getElementById('lastSent').textContent = `Error: ${err.message}`;
            }
        }

        connect();
    </script>
</body>
</html>
